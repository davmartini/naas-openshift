apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:

- target: ## NameSpace Creation
    kind: Namespace
    name: template
  patch: |-                   
    - op: replace
      path: /metadata/name
      value: namespace02

- target: ## Quota Creation
    kind: ResourceQuota
    name: template-quota
  patch: |-                   
    - op: replace
      path: /metadata/name
      value: namespace02-quota

- target: ## Quota Creation
    kind: ResourceQuota
    name: template-quota
  patch: |-                   
    - op: replace
      path: /metadata/namespace
      value: namespace02

- target: ## Quota Creation
    kind: ResourceQuota
    name: template-quota
  patch: |-                   
    - op: replace
      path: /spec/hard/requests.cpu
      value: 8

- target: ## Quota Creation
    kind: ResourceQuota
    name: template-quota
  patch: |-                   
    - op: replace
      path: /spec/hard/requests.memory
      value: 16

bases:
- ../base