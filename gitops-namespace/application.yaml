apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace01
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/davmartini/naas-openshift.git
    targetRevision: HEAD
    path: gitops-namespace/namespace01
  destination:
    server: https://kubernetes.default.svc