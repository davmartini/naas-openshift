apiVersion: v1
kind: ResourceQuota
metadata:
  name: template-quota
  namespace: template  # Replace with your target namespace
spec:
  hard:
    requests.cpu: "4"       # Total CPU requests cannot exceed 4 cores
    requests.memory: 8Gi     # Total memory requests cannot exceed 8 GiB
    limits.cpu: "8"          # Total CPU limits cannot exceed 8 cores
    limits.memory: 16Gi      # Total memory limits cannot exceed 16 GiB
    pods: "100"                # Maximum number of pods
    services: "10"            # Maximum number of services
    persistentvolumeclaims: "10" # Maximum number of PVCs
    requests.storage: "100Gi" # Total storage requests cannot exceed 100 GiB